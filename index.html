<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual Boot Menu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: 'Courier New', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .boot-container {
            text-align: center;
        }

        .boot-title {
            color: #fff;
            font-size: 28px;
            font-weight: normal;
            letter-spacing: 4px;
            margin-bottom: 60px;
            text-transform: uppercase;
        }

        .boot-title::after {
            content: "_";
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .boot-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .boot-btn {
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            padding: 14px 40px;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 280px;
            letter-spacing: 2px;
        }

        .boot-btn:hover {
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="boot-container">
        <div class="boot-title">DUAL BOOT MENU</div>
        <div class="boot-buttons">
            <button class="boot-btn" onclick="window.location.href='https://The-GamerZ-OS.github.io/The_GamerZ-browser/gamerz.html'">The_GamerZ Browser</button>
            <button class="boot-btn" onclick="window.location.href='https://the-gamerz-os.github.io/The_GamerZ-browser/gbrowser.html'">GBrowser</button>
            <button class="boot-btn" onclick="window.location.href='https://the-gamerz-os.github.io/The_GamerZ-browser/Read%20for%20Info.md'">Info</button>
        </div>
    </div>
</body>
</html>
